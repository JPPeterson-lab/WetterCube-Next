name: Fehler melden / Report a bug
description: Etwas funktioniert nicht wie erwartet / Something does not work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Firmware-Version / Firmware version
      description: Steht auf der Weboberfläche und im /log (z. B. 0.1.0-alpha1)
    validations:
      required: true
  - type: dropdown
    id: board
    attributes:
      label: Board
      options:
        - ESP32 CYD ESP32-2432S028 (ST7789)
        - ESP32 CYD mit ILI9341
        - Anderes / other
    validations:
      required: true
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert? / What happened?
      description: Was hast du erwartet, was ist stattdessen passiert, wie lässt es sich wiederholen?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Text von /log
      description: "http://wettercube-next.local/log öffnen, den Text kopieren. Bitte vorher WLAN-Namen, Standort und Ähnliches entfernen, wenn du sie nicht veröffentlichen möchtest."
      render: text
